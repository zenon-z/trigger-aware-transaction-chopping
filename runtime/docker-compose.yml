name: cpr-chopping

# Two services, identical except for storage, so the commit cost differs only where intended
# Run ONE at a time:
#   docker compose up -d pg-tmpfs   -> port 15433, data on tmpfs (cheap commits; main sweep)
#   docker compose up -d pg-disk    -> port 15434, data on a named volume (real fsync; check point)
# Ports differ from the TS_Simulator harness (15432), so both setups can coexist.
# Durability settings are left at Postgres defaults (fsync=on, synchronous_commit=on) in both;
# payment.py records them with every result row.

x-postgres: &postgres
  image: postgres:16.15
  environment:
    POSTGRES_USER: cpr
    POSTGRES_PASSWORD: cpr
    POSTGRES_DB: cpr
  command:
    - "postgres"
    - "-c"
    - "max_connections=200"
    - "-c"
    - "shared_buffers=256MB"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U cpr -d cpr"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  pg-tmpfs:
    <<: *postgres
    container_name: cpr_chop_pg_tmpfs
    ports:
      - "15433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # pg-tmpfs plus logging of every lock wait longer than 1 ms (MODEL.md R22; for testing the
  # server's locklog stage)
  pg-tmpfs-locklog:
    <<: *postgres
    container_name: cpr_chop_pg_tmpfs_locklog
    ports:
      - "15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB",
              "-c", "logging_collector=on", "-c", "log_lock_waits=on",
              "-c", "deadlock_timeout=1ms", "-c", "log_rotation_size=0",
              "-c", "log_rotation_age=0"]

  pg-disk:
    <<: *postgres
    container_name: cpr_chop_pg_disk
    ports:
      - "15434:5432"
    volumes:
      - cpr_chop_pgdata:/var/lib/postgresql/data

volumes:
  cpr_chop_pgdata:
